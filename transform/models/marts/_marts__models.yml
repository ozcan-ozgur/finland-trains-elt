models:
  - name: fct_stop_events
    columns:
      - name: stop_event_id
        data_tests:
          - unique
          - not_null
      - name: train_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_trains')
                field: train_id
      - name: train_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['Commuter', 'Cargo', 'Long-distance', 'Shunting', 'Locomotive', 'On-track machines', 'Test drive']
              config:
                severity: warn
      - name: departure_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: station_short_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_short_code

  - name: dim_trains
    description: "One row per train run (departure date + train number)."
    columns:
      - name: train_id
        data_tests:
          - unique
          - not_null

  - name: dim_dates
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: dim_stations
    columns:
      - name: station_short_code
        data_tests:
          - unique
          - not_null